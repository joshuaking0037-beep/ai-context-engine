<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Context Engine</title>
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Marked.js for parsing Markdown response from the LLM -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="container">
        <header class="header">
            <h1>AI Context Engine</h1>
            <p>Powered by Python, Flask, and Groq Llama 3</p>
        </header>

        <main class="main-content">
            <div class="glass-panel input-section">
                <form id="analyze-form">
                    <div class="form-group">
                        <label for="task-select">Select AI Task</label>
                        <select id="task-select" name="task" required>
                            <option value="summarize">Summarize Document</option>
                            <option value="action_items">Extract Action Items</option>
                            <option value="key_entities">Identify Key Entities</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="input-text">Input Text</label>
                        <textarea id="input-text" name="text" rows="10" placeholder="Paste your text or document content here..." required></textarea>
                    </div>

                    <button type="submit" id="submit-btn" class="primary-btn">
                        <span class="btn-text">Analyze Content</span>
                        <div class="loader hidden" id="btn-loader"></div>
                    </button>
                </form>
            </div>

            <div class="glass-panel output-section">
                <h2>Analysis Result</h2>
                <div id="result-container" class="result-placeholder">
                    Results will appear here...
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>Built as a Proof of Work demonstrating AI Integration capabilities.</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
